name: Collect repository signals

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Verify activity rules
        run: python -m unittest discover -s tests -p 'test_repository_signals.py'
      - name: Collect public repository signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_repository_signals.py
      - uses: actions/upload-artifact@v4
        with:
          name: repository-signals
          path: data/repository-signals/
          retention-days: 30
      - name: Commit collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repository-signals/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): refresh repository activity signals"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
