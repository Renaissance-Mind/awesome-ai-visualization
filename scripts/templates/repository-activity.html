<div id="repository-monthly-activity">
  <style>
    #repository-monthly-activity { position: relative; }
    #repository-monthly-activity .activity-heading { padding-right: 96px; }
    #repository-monthly-activity .activity-panel { margin-top: 24px; }
    #repository-monthly-activity .activity-chart { width: 100%; display: block; overflow: visible; }
    #repository-monthly-activity .activity-chart text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #repository-monthly-activity .activity-chart .domain { display: none; }
    #repository-monthly-activity .activity-chart .tick line { stroke: var(--border); }
    #repository-monthly-activity .activity-chart .activity-line { fill: none; stroke-width: 2; }
    #repository-monthly-activity .activity-chart .partial-line { stroke-dasharray: 4 4; }
    #repository-monthly-activity .activity-chart .month-guide { stroke: var(--border); stroke-width: 1; }
    #repository-monthly-activity .activity-chart .month-hit { fill: transparent; }
    #repository-monthly-activity .activity-chart .point { stroke: var(--background); stroke-width: 1.5; }
    #repository-monthly-activity .activity-coverage { margin-top: 8px; }
    #repository-monthly-activity .activity-tooltip { position: absolute; pointer-events: none; z-index: 10; padding: 8px 12px; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 4px; }
    #repository-monthly-activity .activity-tooltip[hidden] { display: none; }
  </style>
  <div class="activity-heading">
    <h2>收录 repo 的月度开发活动</h2>
    <div class="text-small text-muted activity-snapshot">__SNAPSHOT_LABEL__</div>
  </div>
  <section class="activity-panel" aria-labelledby="activity-commits-heading">
    <h3 id="activity-commits-heading">按 commit 统计</h3>
    <svg class="activity-chart" data-measure="commits" role="img" aria-label="收录 GitHub 仓库按月汇总的 commit 数量"></svg>
    <div class="text-small text-muted activity-coverage">__COMMIT_COVERAGE__</div>
  </section>
  <section class="activity-panel" aria-labelledby="activity-created-heading">
    <h3 id="activity-created-heading">按 repo 创建统计</h3>
    <svg class="activity-chart" data-measure="repos_created" role="img" aria-label="收录 GitHub 仓库按月汇总的新建 repo 数量"></svg>
    <div class="text-small text-muted activity-coverage">__CREATION_COVERAGE__</div>
  </section>
  <div class="tooltip activity-tooltip tabular-nums" role="tooltip" hidden></div>
  <div class="sr-only" id="activity-accessible-description">__ACCESSIBLE_DESCRIPTION__</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('repository-monthly-activity');
  const tooltip = root.querySelector('.activity-tooltip');
  const raw = /* MONTHLY_DATA */ [];
  const rows = raw.map(d => ({ ...d, x: new Date(d.month + '-15T00:00:00Z') }));
  const number = new Intl.NumberFormat('zh-CN');
  const charts = [...root.querySelectorAll('.activity-chart')];
  const saved = window.openai?.widgetState?.privateContent;
  const initialIndex = rows.findIndex(row => row.month === saved?.month);
  let selectedMonth = initialIndex < 0 ? null : initialIndex;
  let pinned = selectedMonth !== null && saved?.pinned === true;
  let layouts = [];

  function showMonth(index, pageX, pageY) {
    selectedMonth = index;
    const row = rows[index];
    for (const layout of layouts) {
      const x = layout.x(row.x);
      layout.guide.attr('x1', x).attr('x2', x).attr('visibility', 'visible');
      layout.point.attr('cx', x).attr('cy', layout.y(row[layout.key])).attr('visibility', 'visible');
    }
    tooltip.replaceChildren();
    const lines = [row.month + (row.partial_month ? '（当月未结束）' : ''),
      'commit：' + number.format(row.commits) + ' 次',
      '新建 repo：' + number.format(row.repos_created) + ' 个'];
    lines.forEach(text => {
      const line = document.createElement('div');
      line.textContent = text;
      tooltip.append(line);
    });
    tooltip.hidden = false;
    const bounds = root.getBoundingClientRect();
    const width = tooltip.getBoundingClientRect().width;
    const height = tooltip.getBoundingClientRect().height;
    tooltip.style.left = Math.max(0, Math.min(bounds.width - width, pageX - bounds.left + 12)) + 'px';
    tooltip.style.top = Math.max(0, Math.min(bounds.height - height, pageY - bounds.top - height - 10)) + 'px';
  }

  function hideMonth() {
    if (pinned) return;
    tooltip.hidden = true;
    selectedMonth = null;
    layouts.forEach(layout => {
      layout.guide.attr('visibility', 'hidden');
      layout.point.attr('visibility', 'hidden');
    });
  }

  function draw() {
    layouts = [];
    charts.forEach((element, panelIndex) => {
      const key = element.dataset.measure;
      const width = Math.max(280, element.getBoundingClientRect().width);
      const height = width < 440 ? 265 : 300;
      const margin = { top: 35, right: 12, bottom: 60, left: 72 };
      const right = width - margin.right;
      const bottom = height - margin.bottom;
      const color = 'var(--viz-series-' + (panelIndex + 1) + ')';
      const svg = d3.select(element).attr('viewBox', '0 0 ' + width + ' ' + height).attr('height', height);
      svg.selectAll('*').remove();
      svg.append('title').text(key === 'commits' ? '按月汇总的 commit 总数' : '按月新建的 repo 数量');
      svg.append('desc').text(document.getElementById('activity-accessible-description').textContent);
      const domain = d3.extent(rows, d => d.x);
      const pad = (domain[1] - domain[0]) * 0.005;
      const x = d3.scaleUtc().domain([new Date(+domain[0] - pad), new Date(+domain[1] + pad)])
        .range([margin.left + 4, right - 4]);
      const observed = d3.extent(rows, d => d[key]);
      const y = d3.scaleLinear().domain([Math.min(0, observed[0]), Math.max(1, observed[1] * 1.15)]).nice()
        .range([bottom - 4, margin.top + 4]);
      const yTicks = y.ticks(4).filter(n => Number.isInteger(n));
      svg.append('g').attr('transform', 'translate(' + margin.left + ',0)')
        .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-(right - margin.left)).tickFormat(number.format).tickPadding(8));
      svg.selectAll('.tick line').attr('opacity', 0.55);
      const tickCount = width < 440 ? 3 : Math.min(8, Math.floor((width - margin.left) / 80));
      const ticks = x.ticks(tickCount);
      const formatDate = (+domain[1] - +domain[0]) / (365.25 * 86400000) > 3
        ? d3.utcFormat('%Y') : d3.utcFormat('%Y-%m');
      svg.append('g').attr('data-x-ticks', '').attr('transform', 'translate(0,' + bottom + ')')
        .call(d3.axisBottom(x).tickValues(ticks).tickFormat(formatDate).tickSize(0).tickPadding(12));
      svg.append('rect').attr('data-chart-frame', '').attr('x', margin.left).attr('y', margin.top)
        .attr('width', right - margin.left).attr('height', bottom - margin.top)
        .attr('fill', 'none').attr('stroke', 'var(--border)').attr('stroke-width', 1);
      svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('x', margin.left).attr('y', 17)
        .text(key === 'commits' ? 'commit（次 / 月）' : '新建 repo（个 / 月）');
      svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x')
        .attr('x', (margin.left + right) / 2).attr('y', height - 10).attr('text-anchor', 'middle')
        .text('月份（Asia/Shanghai）');
      const last = rows.at(-1);
      const partialX = x(new Date(last.month + '-01T00:00:00Z'));
      svg.append('rect').attr('x', Math.max(margin.left, partialX)).attr('y', margin.top)
        .attr('width', Math.max(0, right - Math.max(margin.left, partialX)))
        .attr('height', bottom - margin.top).attr('fill', 'var(--muted)').attr('opacity', 0.55);
      const line = d3.line().x(d => x(d.x)).y(d => y(d[key]));
      svg.append('path').datum(rows.filter(d => !d.partial_month))
        .attr('class', 'activity-line').attr('stroke', color).attr('d', line);
      svg.append('path').datum(rows.slice(-2)).attr('class', 'activity-line partial-line')
        .attr('stroke', color).attr('d', line);
      const peak = d3.greatest(rows, d => d[key]);
      svg.append('circle').attr('cx', x(peak.x)).attr('cy', y(peak[key])).attr('r', 3).attr('fill', color);
      const peakX = x(peak.x);
      const nearRight = peakX > right - 125;
      const annotation = svg.append('text').attr('data-peak-label', '')
        .attr('x', peakX + (nearRight ? -6 : 6)).attr('y', y(peak[key]) - 10)
        .attr('text-anchor', nearRight ? 'end' : 'start')
        .text(peak.month + ' · ' + number.format(peak[key]));
      const guide = svg.append('line').attr('class', 'month-guide')
        .attr('y1', margin.top).attr('y2', bottom).attr('visibility', 'hidden');
      const point = svg.append('circle').attr('class', 'point').attr('r', 4).attr('fill', color)
        .attr('visibility', 'hidden');
      layouts.push({ key, x, y, guide, point });
      svg.append('rect').attr('data-chart-hit', '').attr('class', 'month-hit')
        .attr('x', margin.left).attr('y', margin.top).attr('width', right - margin.left)
        .attr('height', bottom - margin.top)
        .on('pointermove', event => {
          if (pinned) return;
          const [px] = d3.pointer(event, element);
          const index = d3.bisector(d => d.x).center(rows, x.invert(px));
          showMonth(index, event.clientX, event.clientY);
        })
        .on('pointerleave', hideMonth)
        .on('click', event => {
          const [px] = d3.pointer(event, element);
          const index = d3.bisector(d => d.x).center(rows, x.invert(px));
          pinned = !(pinned && selectedMonth === index);
          if (pinned) showMonth(index, event.clientX, event.clientY);
          else hideMonth();
          if (window.openai?.setWidgetState) {
            window.openai.setWidgetState({
              modelContent: pinned ? { month: rows[index].month, commits: rows[index].commits, reposCreated: rows[index].repos_created } : null,
              privateContent: pinned ? { month: rows[index].month, pinned } : null,
            }).catch(() => {});
          }
        });
      // Remove optional labels/ticks rather than shrink type at narrow widths.
      const labelBounds = annotation.node().getBBox();
      if (labelBounds.x < margin.left + 4 || labelBounds.x + labelBounds.width > right - 4) annotation.remove();
      let previousEnd = -Infinity;
      svg.selectAll('[data-x-ticks] .tick').each(function() {
        const bounds = this.getBoundingClientRect();
        if (bounds.left < previousEnd + 4) d3.select(this).remove();
        else previousEnd = bounds.right;
      });
    });
    if (selectedMonth !== null) {
      layouts.forEach(layout => {
        layout.guide.attr('x1', layout.x(rows[selectedMonth].x)).attr('x2', layout.x(rows[selectedMonth].x)).attr('visibility', 'visible');
        layout.point.attr('cx', layout.x(rows[selectedMonth].x)).attr('cy', layout.y(rows[selectedMonth][layout.key])).attr('visibility', 'visible');
      });
    }
  }
  new ResizeObserver(draw).observe(root);
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    if (state === undefined) return;
    const index = rows.findIndex(row => row.month === state?.privateContent?.month);
    const nextMonth = index < 0 ? null : index;
    const nextPinned = nextMonth !== null && state?.privateContent?.pinned === true;
    if (selectedMonth === nextMonth && pinned === nextPinned) return;
    selectedMonth = nextMonth;
    pinned = nextPinned;
    tooltip.hidden = true;
    draw();
  });
  draw();
})();
</script>
